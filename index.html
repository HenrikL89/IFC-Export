<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>IFC Exporter v23</title>
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f4f6; padding: 10px; }
        .container { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 10px solid #f43f5e; }
        .version-badge { background: #f43f5e; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-align: center; display: block; margin-bottom: 10px; }
        h1 { font-size: 16px; margin: 0 0 10px 0; }
        .btn { background-color: #0078d4; color: white; border: none; border-radius: 5px; padding: 10px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 8px; }
        #log { background: #111; color: #10b981; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 10px; height: 300px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 10px; }
        .manual-btn { display: block; background: #10b981; color: white; text-decoration: none; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; margin-top: 5px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="version-badge">VERSION 23.0 (HYPER-SCAN)</div>
        <h1>IFC Exporter</h1>
        <button id="scanBtn" class="btn" style="background: #4b5563;">1. Finn aktive modeller</button>
        <div id="log">> Initialiserer API...</div>
        <div id="fileList"></div>
    </div>

    <script>
        let API = null, accessToken = null, currentProjectId = null, activeIFCModels = [];

        async function init() {
            try {
                API = await TrimbleConnectWorkspace.connect(window.parent, (event, args) => {
                    if (event === "extension.accessToken" && args.data) {
                        accessToken = typeof args.data === "string" ? args.data : args.data.accessToken;
                    }
                });
                const project = await API.project.getCurrentProject();
                currentProjectId = project.id;
                await API.extension.requestPermission("accesstoken");
                log("Klar.");
            } catch (err) { log("Feil: " + err.message); }
        }

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerText += `\n> ${msg}`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (!API) return;
            try {
                const models = await API.viewer.getModels();
                const list = document.getElementById('fileList');
                list.innerHTML = "";
                
                activeIFCModels = models.filter(m => m.name.toLowerCase().endsWith('.ifc') && (m.state === 'loaded' || m.loaded === true));
                
                log(`Fant ${activeIFCModels.length} aktive modeller.`);

                for (const m of activeIFCModels) {
                    // HYPER-SCAN: Vi leter etter den ekte GUID-en som ikke starter med understrek
                    const realId = m.modelId || m.versionId || m.fileId || m.id;
                    
                    log(`Klar: ${m.name}`);
                    log(`Bruker ID: ${realId}`);

                    // Vi lager to typer knapper - én av disse MÅ fungere på Europeisk server
                    const container = document.createElement('div');
                    container.style.marginBottom = "15px";
                    container.innerHTML = `<strong>${m.name}</strong>`;

                    // Variant A: Standard Europeisk nedlasting
                    const urlA = `https://app21.connect.trimble.com/tc/api/2.0/files/${realId}/download?access_token=${accessToken}`;
                    container.appendChild(createBtn(urlA, "LAST NED (Standard)"));

                    // Variant B: Prosjekt-spesifikk nedlasting (nyere EU-metode)
                    const urlB = `https://app21.connect.trimble.com/tc/api/2.0/projects/${currentProjectId}/files/${realId}/download?access_token=${accessToken}`;
                    container.appendChild(createBtn(urlB, "LAST NED (Prosjekt-link)"));

                    list.appendChild(container);
                }
            } catch (err) { log("Skanning feilet."); }
        });

        function createBtn(url, text) {
            const a = document.createElement('a');
            a.className = "manual-btn";
            a.href = url;
            a.target = "_blank";
            a.innerText = text;
            a.style.marginBottom = "5px";
            return a;
        }

        init();
    </script>
</body>
</html>
