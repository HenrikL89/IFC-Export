<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>IFC Exporter v20</title>
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f4f6; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 10px solid #000; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { font-size: 18px; color: #111827; margin: 0; }
        .version-badge { background: #d4af37; color: #000; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .btn { background-color: #0078d4; color: white; border: none; border-radius: 5px; padding: 12px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 10px; }
        .btn:disabled { background-color: #d1d5db; cursor: not-allowed; }
        #log { background: #111827; color: #10b981; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 11px; height: 250px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 10px; }
        .manual-btn { display: block; background: #d4af37; color: #000; text-decoration: none; padding: 12px; border-radius: 5px; text-align: center; font-weight: bold; margin-top: 8px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>IFC Exporter</h1>
            <span class="version-badge">VERSION 20.0</span>
        </div>
        
        <button id="scanBtn" class="btn" style="background: #4b5563;">1. Finn aktive modeller</button>
        <button id="exportBtn" class="btn" disabled>2. Generer nedlastingslenker</button>
        
        <div id="log">> Initialiserer API...</div>
        <div id="fileList"></div>
    </div>

    <script>
        let API = null;
        let accessToken = null;
        let activeIFCModels = [];

        async function init() {
            try {
                API = await TrimbleConnectWorkspace.connect(window.parent, (event, args) => {
                    if (event === "extension.accessToken" && args.data) {
                        accessToken = typeof args.data === "string" ? args.data : args.data.accessToken;
                    }
                });
                await API.extension.requestPermission("accesstoken");
                log("Tilkoblet Trimble Connect.");
            } catch (err) { log("Feil: " + err.message); }
        }

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerText += `\n> ${msg}`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (!API) return;
            try {
                const models = await API.viewer.getModels();
                // VIKTIG: Vi logger alle modeller til konsollen slik at vi kan se alle ID-er
                console.log("Modeller funnet:", models);

                activeIFCModels = models.filter(m => 
                    m.name.toLowerCase().endsWith('.ifc') && 
                    (m.state === 'loaded' || m.loaded === true)
                );
                
                log(`Fant ${activeIFCModels.length} aktive modeller.`);
                document.getElementById('exportBtn').disabled = false;
            } catch (err) { log("Skanning feilet."); }
        });

        document.getElementById('exportBtn').addEventListener('click', async () => {
            if (!accessToken) {
                const result = await API.extension.requestPermission("accesstoken");
                accessToken = result.accessToken || result;
            }

            log("Genererer lenker basert på GUID...");
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = ""; 

            activeIFCModels.forEach((model) => {
                // VIKTIG LOGIKK: 
                // Vi bruker model.modelId eller model.versionId eller model.fileId.
                // Det er denne GUID-en (som 'BrtHmXegdgs') som fungerer i nedlastings-URLen.
                const realFileId = model.modelId || model.versionId || model.fileId || model.id;
                
                // Vi bruker den offisielle Europeiske stien (v2.0)
                const directUrl = `https://app21.connect.trimble.com/tc/api/2.0/files/${realFileId}/download?access_token=${accessToken}`;

                const dl = document.createElement('a');
                dl.className = "manual-btn";
                dl.href = directUrl;
                dl.target = "_blank"; 
                dl.rel = "noopener noreferrer";
                dl.innerText = "LAST NED: " + model.name;
                
                fileList.appendChild(dl);
                log(`Klar: ${model.name}`);
            });
        });

        init();
    </script>
</body>
</html>
