<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Viewer Exporter</title>
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f9fafb; padding: 15px; color: #1f2937; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 5px solid #0078d4; }
        h1 { font-size: 18px; color: #0078d4; margin-top: 0; }
        .btn { 
            background-color: #0078d4; color: white; border: none; border-radius: 5px; 
            padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; 
            width: 100%; transition: 0.2s; margin-bottom: 10px;
        }
        .btn:hover { background-color: #005a9e; }
        .btn:disabled { background-color: #d1d5db; cursor: not-allowed; }
        #log { 
            margin-top: 15px; background: #111827; color: #10b981; 
            padding: 10px; border-radius: 4px; font-family: monospace; 
            font-size: 11px; height: 300px; overflow-y: auto; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>IFC Viewer Exporter</h1>
        <div id="status" style="font-size: 13px; margin-bottom: 10px; font-weight: bold; color: #4b5563;">Venter på token...</div>

        <button id="scanBtn" class="btn" style="background-color: #4b5563;">1. Finn aktive modeller i 3D</button>
        <button id="exportBtn" class="btn" disabled>2. Start nedlasting</button>
        
        <div id="log">> Kobler til Trimble Connect...</div>
    </div>

    <script>
        let API = null;
        let accessToken = null;
        let activeIFCModels = [];

        // 1. Initialiserer API og ber om Token (samme som Topics Dashboard)
        async function init() {
            try {
                API = await TrimbleConnectWorkspace.connect(window.parent, (event, args) => {
                    if (event === "extension.accessToken") {
                        accessToken = typeof args.data === "string" ? args.data : args.data.accessToken;
                        log("Access Token mottatt.");
                        document.getElementById('status').innerText = "Klar til skanning";
                    }
                });

                // Be spesifikt om tilgang til token
                await API.extension.requestPermission("accesstoken");
            } catch (err) {
                log("Feil ved oppstart: " + err.message, "#ff5f56");
            }
        }

        function log(msg, color = "#10b981") {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div style="color: ${color}">> ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function downloadFile(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => document.body.removeChild(a), 500);
        }

        // 2. Finn aktive modeller i viewer
        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (!API) return;
            try {
                log("Skanner 3D-visning...");
                const allModels = await API.viewer.getModels();
                
                activeIFCModels = allModels.filter(m => {
                    const isIfc = m.name.toLowerCase().endsWith('.ifc');
                    const isLoaded = (m.state === 'loaded' || m.loaded === true);
                    return isIfc && isLoaded;
                });

                if (activeIFCModels.length === 0) {
                    log("Ingen aktive modeller funnet.", "#ff5f56");
                } else {
                    log(`FUNNET: ${activeIFCModels.length} aktiv(e) modell(er).`);
                    activeIFCModels.forEach(m => log(` - ${m.name}`));
                    document.getElementById('exportBtn').disabled = false;
                }
            } catch (err) {
                log("Skanning feilet: " + err.message, "#ff5f56");
            }
        });

        // 3. Last ned ved å bruke REST API direkte med token
        document.getElementById('exportBtn').addEventListener('click', async () => {
            if (!accessToken) {
                log("Mangler tilgangstoken. Prøv å laste siden på nytt.", "#ff5f56");
                return;
            }

            const btn = document.getElementById('exportBtn');
            btn.disabled = true;
            log("Starter batch-nedlasting...");

            for (const model of activeIFCModels) {
                try {
                    log(`Henter nedlastingslenke for ${model.name}...`);
                    
                    // Vi kaller Trimble Connect REST API direkte (v2.0)
                    const response = await fetch(`https://app.connect.trimble.com/tc/api/2.0/files/${model.id}`, {
                        method: "GET",
                        headers: {
                            "Authorization": `Bearer ${accessToken}`,
                            "Accept": "application/json"
                        }
                    });

                    if (!response.ok) throw new Error(`Server svarte med ${response.status}`);

                    const fileData = await response.json();
                    
                    if (fileData.downloadUrl) {
                        downloadFile(fileData.downloadUrl, model.name);
                        log(`Suksess: ${model.name}`);
                    }
                    
                    await new Promise(r => setTimeout(r, 1000));
                } catch (e) {
                    log(`FEIL med ${model.name}: ${e.message}`, "#ff5f56");
                }
            }
            log("Ferdig.");
            btn.disabled = false;
        });

        init();
    </script>
</body>
</html>
