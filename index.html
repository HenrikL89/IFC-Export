<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Viewer Exporter</title>
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f9fafb; padding: 15px; color: #1f2937; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 5px solid #0078d4; }
        h1 { font-size: 18px; color: #0078d4; margin-top: 0; }
        .btn { 
            background-color: #0078d4; color: white; border: none; border-radius: 5px; 
            padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; 
            width: 100%; transition: 0.2s; margin-bottom: 10px;
        }
        .btn:hover { background-color: #005a9e; }
        .btn:disabled { background-color: #d1d5db; cursor: not-allowed; }
        #log { 
            margin-top: 15px; background: #111827; color: #10b981; 
            padding: 10px; border-radius: 4px; font-family: monospace; 
            font-size: 11px; height: 300px; overflow-y: auto; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>IFC Viewer Exporter</h1>
        <div id="status" style="font-size: 13px; margin-bottom: 10px; font-weight: bold; color: #4b5563;">Klar</div>

        <button id="scanBtn" class="btn" style="background-color: #4b5563;">1. Finn aktive modeller i 3D</button>
        <button id="exportBtn" class="btn" disabled>2. Start nedlasting</button>
        
        <div id="log">> Koblet til Trimble Connect.</div>
    </div>

    <script>
        let API = null;
        let activeIFCModels = [];

        // Kobler til med det nye biblioteket
        window.TrimbleConnectWorkspace.connect(window.parent, (event, args) => {
        }).then((api) => {
            API = api;
            log("API klar.");
        });

        function log(msg, color = "#10b981") {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div style="color: ${color}">> ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function downloadFile(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => document.body.removeChild(a), 500);
        }

        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (!API) return;
            try {
                log("Skanner 3D-visning...");
                const allModels = await API.viewer.getModels();
                
                activeIFCModels = allModels.filter(m => {
                    const isIfc = m.name.toLowerCase().endsWith('.ifc');
                    // Sjekker om den er lastet i vieweren
                    const isLoaded = (m.state === 'loaded' || m.loaded === true);
                    return isIfc && isLoaded;
                });

                if (activeIFCModels.length === 0) {
                    log("Ingen aktive modeller funnet i 3D-vinduet.", "#ff5f56");
                    document.getElementById('exportBtn').disabled = true;
                } else {
                    log(`FUNNET: ${activeIFCModels.length} aktiv(e) IFC-modell(er).`);
                    activeIFCModels.forEach(m => log(` - ${m.name}`));
                    document.getElementById('exportBtn').disabled = false;
                    document.getElementById('status').innerText = `${activeIFCModels.length} modell(er) klar.`;
                }
            } catch (err) {
                log("Feil ved skanning: " + err.message, "#ff5f56");
            }
        });

        document.getElementById('exportBtn').addEventListener('click', async () => {
            const btn = document.getElementById('exportBtn');
            btn.disabled = true;
            log("Starter nedlasting...");

            for (let i = 0; i < activeIFCModels.length; i++) {
                const model = activeIFCModels[i];
                const fileId = model.id;
                
                try {
                    log(`Henter data for: ${model.name}...`);
                    
                    // I det NYE API-et (som du bruker) heter funksjonen getFiles([id])
                    // Den tar en liste med ID-er og returnerer en liste med resultater
                    const files = await API.project.getFiles([fileId]);
                    
                    if (files && files.length > 0 && files[0].downloadUrl) {
                        downloadFile(files[0].downloadUrl, model.name);
                        log(`OK: ${model.name}`);
                    } else {
                        log(`Kunne ikke finne nedlastings-URL for ${model.name}`, "#ff5f56");
                    }
                    
                    await new Promise(r => setTimeout(r, 1000));
                } catch (e) {
                    // Hvis getFiles også feiler, logger vi nøyaktig hva som skjedde
                    log(`FEIL: ${e.message}`, "#ff5f56");
                }
            }
            log("Fullført.");
            btn.disabled = false;
        });
    </script>
</body>
</html>
