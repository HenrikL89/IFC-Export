<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>IFC Exporter v26</title>
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f4f6; padding: 15px; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 10px solid #eab308; }
        .version-badge { background: #eab308; color: #000; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-align: center; display: block; margin-bottom: 10px; }
        h1 { font-size: 18px; color: #111827; margin: 0 0 10px 0; }
        .btn { background-color: #0078d4; color: white; border: none; border-radius: 5px; padding: 12px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 10px; }
        .btn:disabled { background-color: #d1d5db; cursor: not-allowed; }
        #log { background: #111827; color: #10b981; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 11px; height: 250px; overflow-y: auto; white-space: pre-wrap; }
        .success-link { display: block; background: #10b981; color: white; padding: 10px; border-radius: 5px; text-align: center; font-weight: bold; text-decoration: none; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="version-badge">VERSION 26.0 (NATIVE MAPPING)</div>
        <h1>IFC Batch Exporter</h1>
        
        <button id="scanBtn" class="btn" style="background: #4b5563;">1. Finn aktive modeller</button>
        <button id="exportBtn" class="btn" disabled>2. Start sikker nedlasting</button>
        
        <div id="log">> Initialiserer API...</div>
        <div id="fileList"></div>
    </div>

    <script>
        let API = null;
        let activeIFCModels = [];

        async function init() {
            try {
                API = await TrimbleConnectWorkspace.connect(window.parent, (event, args) => {});
                // Ber om rettigheter for sikkerhets skyld
                await API.extension.requestPermission("accesstoken");
                log("Tilkoblet Trimble Connect.");
            } catch (err) { log("Feil ved oppstart: " + err.message); }
        }

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerText += `\n> ${msg}`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (!API) return;
            try {
                const models = await API.viewer.getModels();
                
                // Filtrerer kun aktive IFC
                activeIFCModels = models.filter(m => 
                    m.name.toLowerCase().endsWith('.ifc') && 
                    (m.state === 'loaded' || m.loaded === true)
                );
                
                log(`Fant ${activeIFCModels.length} aktive modeller.`);
                if (activeIFCModels.length > 0) {
                    activeIFCModels.forEach(m => {
                        // Viser ID-ene vi fant basert på loggen din
                        const fId = m.modelId || m.fileId; // Dette skal tilsvare tz_s8YjoVLs
                        const vId = m.versionId || m.id;   // Dette skal tilsvare pADf26ghCNM
                        log(`- ${m.name} (FileID: ${fId ? fId.substring(0,5)+'...' : 'ukjent'})`);
                    });
                    document.getElementById('exportBtn').disabled = false;
                }
            } catch (err) { log("Skanning feilet."); }
        });

        document.getElementById('exportBtn').addEventListener('click', async () => {
            if (!API) return;
            const btn = document.getElementById('exportBtn');
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = "";
            btn.disabled = true;

            log("Henter signerte lenker via Trimble Proxy...");

            for (const model of activeIFCModels) {
                try {
                    log(`Behandler ${model.name}...`);
                    
                    // NØKKELEN TIL SUKSESS:
                    // Loggen din viste at tz_s8YjoVLs er den ekte FileID.
                    // I API-objektet ligger denne vanligvis under model.modelId eller model.fileId.
                    // Når vi mater denne inn i API.project.getFiles, gjør Trimble nøyaktig det
                    // nettverkskallet du logget over, helt uten CORS-blokkering.
                    
                    const correctFileId = model.modelId || model.fileId || model.id;
                    
                    let fileResult = null;
                    
                    if (API.project && typeof API.project.getFiles === 'function') {
                        const responseArray = await API.project.getFiles([correctFileId]);
                        fileResult = responseArray ? responseArray[0] : null;
                    } else if (API.project && typeof API.project.getFile === 'function') {
                        fileResult = await API.project.getFile(correctFileId);
                    }

                    // Sjekker om API-et klarte å hente den signerte lenken
                    if (fileResult && fileResult.downloadUrl) {
                        log(`SUKSESS: Lenke generert for ${model.name}`);
                        
                        // Vi lager en grønn knapp som åpner den ferdigsignerte lenken i ny fane
                        const a = document.createElement('a');
                        a.className = "success-link";
                        a.href = fileResult.downloadUrl;
                        a.target = "_blank";
                        a.rel = "noopener noreferrer";
                        a.innerText = "LAST NED: " + model.name;
                        fileList.appendChild(a);

                        // Prøver også å trigge klikket automatisk
                        setTimeout(() => {
                            const tempLink = document.createElement('a');
                            tempLink.href = fileResult.downloadUrl;
                            tempLink.download = model.name;
                            tempLink.target = "_blank";
                            document.body.appendChild(tempLink);
                            tempLink.click();
                            document.body.removeChild(tempLink);
                        }, 500);

                    } else {
                        throw new Error("API returnerte tomt fildata-objekt.");
                    }

                } catch (err) {
                    log(`FEIL: Klarte ikke å hente lenke for ${model.name}.`);
                    log(`Teknisk årsak: ${err.message}`);
                }
                await new Promise(r => setTimeout(r, 1200));
            }
            log("Ferdig.");
            btn.disabled = false;
        });

        init();
    </script>
</body>
</html>
