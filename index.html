<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Batch Exporter</title>
    
    <!-- Samme API som i Dashboard-eksempelet ditt -->
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f9fafb; padding: 15px; color: #1f2937; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; color: #111827; margin-top: 0; }
        p { color: #6b7280; font-size: 13px; }
        
        .btn { 
            background-color: #3b82f6; color: white; border: none; border-radius: 5px; 
            padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; 
            width: 100%; transition: 0.2s;
        }
        .btn:hover { background-color: #2563eb; }
        .btn:disabled { background-color: #d1d5db; cursor: not-allowed; }

        #log { 
            margin-top: 20px; background: #111827; color: #10b981; 
            padding: 10px; border-radius: 5px; font-family: monospace; 
            font-size: 12px; height: 150px; overflow-y: auto; 
        }
        .status-msg { margin-top: 10px; font-weight: 600; font-size: 13px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>IFC Batch Exporter</h1>
        <p>Laster ned alle synlige IFC-modeller til din maskin.</p>

        <button id="exportBtn" class="btn">Velg mappe & start eksport</button>
        
        <div id="status" class="status-msg">Venter på tilkobling...</div>
        <div id="log">> Initialiserer...</div>
    </div>

    <script>
        let API = null;

        // 1. Koble til API på nøyaktig samme måte som Dashboard-eksempelet
        TrimbleConnectWorkspace.connect(window.parent, (event, args) => {
            // Håndterer eventer hvis nødvendig
        }).then((api) => {
            API = api;
            document.getElementById('log').innerText = "> Koblet til Trimble Connect.";
            document.getElementById('status').innerText = "Klar";
        });

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerText += `\n> ${msg}`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        document.getElementById('exportBtn').addEventListener('click', async () => {
            if (!API) return;

            try {
                // Sjekk modeller
                const models = await API.viewer.getModels();
                const ifcModels = models.filter(m => m.name.toLowerCase().endsWith('.ifc'));

                if (ifcModels.length === 0) {
                    log("Ingen IFC-filer funnet i visningen.");
                    return;
                }

                // Sjekk nettleser-støtte
                if (!window.showDirectoryPicker) {
                    alert("Bruk Chrome eller Edge for å eksportere til mappe.");
                    return;
                }

                const dirHandle = await window.showDirectoryPicker();
                const btn = document.getElementById('exportBtn');
                btn.disabled = true;

                log(`Starter eksport av ${ifcModels.length} filer...`);

                for (const model of ifcModels) {
                    log(`Henter ${model.name}...`);
                    
                    try {
                        const fileData = await API.project.getFile(model.id);
                        const response = await fetch(fileData.downloadUrl);
                        const blob = await response.blob();

                        const fileHandle = await dirHandle.getFileHandle(model.name, { create: true });
                        const writable = await fileHandle.createWritable();
                        await writable.write(blob);
                        await writable.close();
                        log(`OK: ${model.name}`);
                    } catch (e) {
                        log(`FEIL med ${model.name}: ${e.message}`);
                    }
                }

                document.getElementById('status').innerText = "Eksport ferdig!";
                log("Batch eksport fullført.");

            } catch (err) {
                log("Kritisk feil: " + err.message);
            } finally {
                document.getElementById('exportBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
