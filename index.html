<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Exporter v9</title>
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f4f6; padding: 10px; }
        .container { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 8px solid #fbbf24; }
        .cache-checker { background: #fbbf24; color: #000; padding: 5px; text-align: center; font-weight: bold; font-size: 10px; border-radius: 4px; margin-bottom: 10px; }
        h1 { font-size: 16px; margin: 0 0 10px 0; color: #111827; }
        .btn { background-color: #0078d4; color: white; border: none; border-radius: 5px; padding: 12px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 8px; }
        .btn:disabled { background-color: #ccc; }
        #log { background: #111; color: #10b981; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 10px; height: 350px; overflow-y: auto; white-space: pre-wrap; }
        .err { color: #ff5f56; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <div class="cache-checker">VERSJON 9.0 (GUL MODUS - INGEN FETCH)</div>
        <h1>IFC Batch Exporter</h1>
        <button id="scanBtn" class="btn" style="background: #4b5563;">1. Finn aktive modeller</button>
        <button id="exportBtn" class="btn" disabled>2. Start nedlasting</button>
        <div id="log">> Initialiserer API...</div>
    </div>

    <script>
        let API = null;
        let activeIFCModels = [];

        async function init() {
            try {
                API = await TrimbleConnectWorkspace.connect(window.parent, (event, args) => {
                    if (event === "extension.accessToken") log("Sikkerhetsnøkkel oppdatert.");
                });
                log("Tilkoblet Trimble Connect.");
                document.getElementById('log').innerText = "> API Klar. Klikk 'Finn modeller'.";
            } catch (err) { log("Oppstart-feil: " + err.message, "err"); }
        }

        function log(msg, className = "") {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `\n<span class="${className}">> ${msg}</span>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (!API) return;
            try {
                const models = await API.viewer.getModels();
                activeIFCModels = models.filter(m => m.name.toLowerCase().endsWith('.ifc') && (m.state === 'loaded' || m.loaded === true));
                log(`Fant ${activeIFCModels.length} aktive IFC-modeller.`);
                if (activeIFCModels.length > 0) {
                    activeIFCModels.forEach(m => log(`- Klar: ${m.name}`));
                    document.getElementById('exportBtn').disabled = false;
                }
            } catch (err) { log("Skanning feilet: " + err.message, "err"); }
        });

        document.getElementById('exportBtn').addEventListener('click', async () => {
            const btn = document.getElementById('exportBtn');
            btn.disabled = true;

            for (const model of activeIFCModels) {
                log(`Behandler ${model.name}...`);
                try {
                    let downloadUrl = null;

                    // Vi prøver alle mulige funksjoner i biblioteket for å finne filen:
                    // Dette omgår CORS fordi vi ikke bruker fetch()
                    if (API.project && typeof API.project.getFiles === 'function') {
                        const res = await API.project.getFiles([model.id]);
                        if (res && res[0]) downloadUrl = res[0].downloadUrl;
                    } 
                    else if (API.project && typeof API.project.getFile === 'function') {
                        const res = await API.project.getFile(model.id);
                        if (res) downloadUrl = res.downloadUrl;
                    }
                    else if (typeof API.getFile === 'function') {
                        const res = await API.getFile(model.id);
                        if (res) downloadUrl = res.downloadUrl;
                    }

                    if (downloadUrl) {
                        const a = document.createElement('a');
                        a.href = downloadUrl;
                        a.download = model.name;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        log(`SUKSESS: Nedlasting startet for ${model.name}`);
                    } else {
                        log(`KUNNE IKKE FINNE nedlastingslenke for ${model.name}.`, "err");
                        log("Prøv å sjekke om utvidelsen har 'file.read' rettigheter.", "err");
                    }
                } catch (err) {
                    log(`FEIL med ${model.name}: ${err.message}`, "err");
                }
                await new Promise(r => setTimeout(r, 1000));
            }
            log("Ferdig.");
            btn.disabled = false;
        });

        init();
    </script>
</body>
</html>
