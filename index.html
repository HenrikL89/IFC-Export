<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>IFC Exporter v22</title>
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f4f6; padding: 10px; }
        .container { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 10px solid #6366f1; }
        .version-badge { background: #6366f1; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-align: center; display: block; margin-bottom: 10px; }
        h1 { font-size: 16px; color: #111827; margin: 0 0 10px 0; }
        .btn { background-color: #0078d4; color: white; border: none; border-radius: 5px; padding: 10px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 8px; }
        .btn:disabled { background-color: #d1d5db; }
        #log { background: #111; color: #10b981; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 9px; height: 250px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 10px; border: 1px solid #333; }
        .debug-box { background: #fffbeb; border: 1px solid #f59e0b; padding: 8px; border-radius: 4px; font-size: 10px; margin-bottom: 10px; color: #92400e; }
        .download-group { border: 1px solid #e5e7eb; padding: 8px; margin-bottom: 10px; border-radius: 5px; background: #fafafa; }
        .manual-btn { display: block; background: #10b981; color: white; text-decoration: none; padding: 8px; border-radius: 4px; text-align: center; font-weight: bold; margin-top: 5px; font-size: 11px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="version-badge">VERSION 22.0 (DEEP DEBUG)</div>
        <h1>IFC Exporter</h1>
        
        <button id="scanBtn" class="btn" style="background: #4b5563;">1. Finn modeller & Debug</button>
        <button id="exportBtn" class="btn" disabled>2. Generer test-lenker</button>
        
        <div id="log">> Initialiserer API...</div>
        <div id="fileList"></div>
    </div>

    <script>
        let API = null, accessToken = null, currentProjectId = null, activeIFCModels = [];

        async function init() {
            try {
                API = await TrimbleConnectWorkspace.connect(window.parent, (event, args) => {
                    if (event === "extension.accessToken" && args.data) {
                        accessToken = typeof args.data === "string" ? args.data : args.data.accessToken;
                    }
                });
                const project = await API.project.getCurrentProject();
                currentProjectId = project.id;
                await API.extension.requestPermission("accesstoken");
                log("API Klar.");
            } catch (err) { log("Start-feil: " + err.message); }
        }

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerText += `\n> ${msg}`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (!API) return;
            try {
                const models = await API.viewer.getModels();
                activeIFCModels = models.filter(m => m.name.toLowerCase().endsWith('.ifc') && (m.state === 'loaded' || m.loaded === true));
                
                if (activeIFCModels.length > 0) {
                    const m = activeIFCModels[0];
                    log("DEBUG INFO FOR FIL:");
                    log(`Navn: ${m.name}`);
                    log(`ID: ${m.id}`);
                    log(`modelId: ${m.modelId || 'Mangler'}`);
                    log(`versionId: ${m.versionId || 'Mangler'}`);
                    log(`Prosjekt: ${currentProjectId}`);
                }
                
                log(`Fant ${activeIFCModels.length} aktive modeller.`);
                document.getElementById('exportBtn').disabled = false;
            } catch (err) { log("Skanning feilet."); }
        });

        document.getElementById('exportBtn').addEventListener('click', async () => {
            if (!accessToken) {
                const result = await API.extension.requestPermission("accesstoken");
                accessToken = result.accessToken || result;
            }

            const fileList = document.getElementById('fileList');
            fileList.innerHTML = ""; 

            activeIFCModels.forEach((model) => {
                const id = model.modelId || model.id;
                const pId = currentProjectId;
                const token = accessToken;
                
                const group = document.createElement('div');
                group.className = 'download-group';
                group.innerHTML = `<strong>${model.name}</strong><br><span style="font-size:9px">Velg lenken som fungerer:</span>`;

                // TEST LENKE 1: Standard v2.0 (Uten prosjekt-sti)
                const url1 = `https://app21.connect.trimble.com/tc/api/2.0/files/${id}/download?access_token=${token}`;
                group.appendChild(createBtn(url1, "Test 1: Standard API"));

                // TEST LENKE 2: Full Prosjekt-sti (Mest brukt i Europa)
                const url2 = `https://app21.connect.trimble.com/tc/api/2.0/projects/${pId}/files/${id}/download?access_token=${token}`;
                group.appendChild(createBtn(url2, "Test 2: Prosjekt-sti"));

                // TEST LENKE 3: Version-basert (Hvis modelId egentlig er en versionId)
                const url3 = `https://app21.connect.trimble.com/tc/api/2.0/projects/${pId}/versions/${id}/download?access_token=${token}`;
                group.appendChild(createBtn(url3, "Test 3: Versjon-sti"));

                fileList.appendChild(group);
            });
            log("Lenker generert. Test dem i rekkefølge.");
        });

        function createBtn(url, text) {
            const a = document.createElement('a');
            a.className = "manual-btn";
            a.href = url;
            a.target = "_blank";
            a.innerText = text;
            return a;
        }

        init();
    </script>
</body>
</html>
