<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Viewer Exporter</title>
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f9fafb; padding: 15px; color: #1f2937; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 5px solid #0078d4; }
        h1 { font-size: 18px; color: #0078d4; margin-top: 0; }
        .btn { 
            background-color: #0078d4; color: white; border: none; border-radius: 5px; 
            padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; 
            width: 100%; transition: 0.2s; margin-bottom: 10px;
        }
        .btn:hover { background-color: #005a9e; }
        .btn:disabled { background-color: #d1d5db; cursor: not-allowed; }
        #log { 
            margin-top: 15px; background: #111827; color: #10b981; 
            padding: 10px; border-radius: 4px; font-family: monospace; 
            font-size: 11px; height: 300px; overflow-y: auto; 
        }
        .debug-info { font-size: 10px; color: #9ca3af; margin-top: 10px; border-top: 1px solid #e5e7eb; padding-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>IFC Viewer Exporter</h1>
        <div id="summary" style="font-size: 13px; margin-bottom: 10px; font-weight: bold;">Venter på skanning...</div>

        <button id="scanBtn" class="btn" style="background-color: #4b5563;">1. Finn aktive modeller i 3D</button>
        <button id="exportBtn" class="btn" disabled>2. Last ned aktive filer</button>
        
        <div id="log">> Tilkoblet og klar.</div>
        <div class="debug-info" id="debug">Debug: Ingen data enda.</div>
    </div>

    <script>
        let API = null;
        let activeIFCModels = [];

        TrimbleConnectWorkspace.connect(window.parent, (event, args) => {
        }).then((api) => {
            API = api;
            log("API lastet inn.");
        });

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>> ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function downloadFile(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => document.body.removeChild(a), 500);
        }

        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (!API) return;
            try {
                log("Henter alle modeller...");
                const allModels = await API.viewer.getModels();
                
                log(`Sjekker ${allModels.length} filer for aktiv status...`);

                // DEBUG: Skriv ut egenskapene til den første IFC-modellen den finner i loggen
                const firstIFC = allModels.find(m => m.name.toLowerCase().endsWith('.ifc'));
                if (firstIFC) {
                    document.getElementById('debug').innerText = "Debug info (første IFC): " + JSON.stringify(firstIFC);
                    console.log("Model properties:", firstIFC);
                }

                // SMART FILTRERING:
                // Vi sjekker alle vanlige flagg for om en modell er "skrudd på"
                activeIFCModels = allModels.filter(m => {
                    const isIfc = m.name.toLowerCase().endsWith('.ifc');
                    
                    // Sjekker om noen av disse er sanne (ulike API-versjoner bruker ulike navn)
                    const isAktiv = (m.loaded === true || m.visible === true || m.enabled === true || m.state === 'loaded');
                    
                    return isIfc && isAktiv;
                });

                if (activeIFCModels.length === 0) {
                    log("Fant ingen aktive IFC-modeller.");
                    log("TIPS: Hvis modellen ER på, sjekk Debug-linjen nederst for å se hvilken status den har.");
                    document.getElementById('summary').innerText = "0 aktive IFC-filer funnet.";
                    document.getElementById('exportBtn').disabled = true;
                } else {
                    log(`FUNNET: ${activeIFCModels.length} aktive modeller.`);
                    activeIFCModels.forEach(m => log(` - ${m.name}`));
                    
                    document.getElementById('summary').innerText = `Klar: ${activeIFCModels.length} filer funnet.`;
                    document.getElementById('exportBtn').disabled = false;
                }
            } catch (err) {
                log("Feil: " + err.message);
            }
        });

        document.getElementById('exportBtn').addEventListener('click', async () => {
            const btn = document.getElementById('exportBtn');
            btn.disabled = true;
            log("Starter nedlasting...");

            for (let i = 0; i < activeIFCModels.length; i++) {
                const model = activeIFCModels[i];
                try {
                    const fileData = await API.project.getFile(model.id);
                    downloadFile(fileData.downloadUrl, model.name);
                    log(`Nedlasting startet: ${model.name}`);
                    await new Promise(r => setTimeout(r, 1000));
                } catch (e) {
                    log(`Kunne ikke laste ned ${model.name}`);
                }
            }
            log("Fullført.");
            btn.disabled = false;
        });
    </script>
</body>
</html>
