<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Viewer Exporter</title>
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f9fafb; padding: 15px; color: #1f2937; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 5px solid #0078d4; }
        h1 { font-size: 18px; color: #0078d4; margin-top: 0; }
        .btn { 
            background-color: #0078d4; color: white; border: none; border-radius: 5px; 
            padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; 
            width: 100%; transition: 0.2s; margin-bottom: 10px;
        }
        .btn:hover { background-color: #005a9e; }
        .btn:disabled { background-color: #d1d5db; cursor: not-allowed; }
        #log { 
            margin-top: 15px; background: #111827; color: #10b981; 
            padding: 10px; border-radius: 4px; font-family: monospace; 
            font-size: 11px; height: 250px; overflow-y: auto; 
        }
        .count-info { font-size: 12px; background: #f3f4f6; padding: 8px; border-radius: 4px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>IFC Viewer Exporter</h1>
        <div id="summary" class="count-info">Venter på skanning...</div>

        <button id="scanBtn" class="btn" style="background-color: #4b5563;">1. Finn aktive modeller i 3D</button>
        <button id="exportBtn" class="btn" disabled>2. Last ned aktive filer</button>
        
        <div id="log">> Initialiserer...</div>
    </div>

    <script>
        let API = null;
        let activeIFCModels = [];

        TrimbleConnectWorkspace.connect(window.parent, (event, args) => {
        }).then((api) => {
            API = api;
            log("Tilkoblet Trimble Connect.");
        });

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div>> ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function downloadFile(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => document.body.removeChild(a), 500);
        }

        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (!API) return;
            try {
                log("Skanner alle filer i prosjektet...");
                const allModels = await API.viewer.getModels();
                
                log(`Totalt antall filer i prosjekttreet: ${allModels.length}`);

                // VIKTIG FILTRERING:
                // Vi sjekker om filen slutter på .ifc OG om den er lastet i vieweren (m.loaded === true)
                activeIFCModels = allModels.filter(m => {
                    const isIfc = m.name.toLowerCase().endsWith('.ifc');
                    const isLoaded = (m.loaded === true); 
                    return isIfc && isLoaded;
                });

                if (activeIFCModels.length === 0) {
                    log("Fant ingen AKTIVE IFC-modeller. Sjekk at modellen er skrudd på i 3D-vinduet.");
                    document.getElementById('summary').innerText = "Ingen aktive IFC-filer funnet.";
                    document.getElementById('exportBtn').disabled = true;
                } else {
                    log(`SUKSESS: Fant ${activeIFCModels.length} aktive IFC-filer.`);
                    activeIFCModels.forEach(m => log(` - KLAR: ${m.name}`));
                    
                    document.getElementById('summary').innerHTML = `<strong>Klar til eksport: ${activeIFCModels.length} filer</strong>`;
                    document.getElementById('exportBtn').disabled = false;
                }
            } catch (err) {
                log("Feil ved skanning: " + err.message);
            }
        });

        document.getElementById('exportBtn').addEventListener('click', async () => {
            const btn = document.getElementById('exportBtn');
            btn.disabled = true;

            log("--- Starter nedlasting ---");
            for (let i = 0; i < activeIFCModels.length; i++) {
                const model = activeIFCModels[i];
                log(`Laster ned (${i+1}/${activeIFCModels.length}): ${model.name}`);
                
                try {
                    const fileData = await API.project.getFile(model.id);
                    downloadFile(fileData.downloadUrl, model.name);
                    
                    // Litt lengre pause mellom hver fil for å unngå at nettleseren blokkerer ved 2000+ filer i minnet
                    await new Promise(r => setTimeout(r, 1200));
                } catch (e) {
                    log(`Kunne ikke laste ned ${model.name}`);
                }
            }
            log("--- Ferdig! ---");
            btn.disabled = false;
        });
    </script>
</body>
</html>
