<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Batch Exporter</title>
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f9fafb; padding: 15px; color: #1f2937; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 20px; color: #0078d4; margin-top: 0; }
        p { color: #6b7280; font-size: 13px; }
        .btn { 
            background-color: #0078d4; color: white; border: none; border-radius: 5px; 
            padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; 
            width: 100%; transition: 0.2s;
        }
        .btn:hover { background-color: #005a9e; }
        .btn:disabled { background-color: #d1d5db; cursor: not-allowed; }
        #log { 
            margin-top: 20px; background: #111827; color: #10b981; 
            padding: 10px; border-radius: 5px; font-family: monospace; 
            font-size: 12px; height: 180px; overflow-y: auto; 
        }
        .status-msg { margin-top: 10px; font-weight: 600; font-size: 13px; }
        .warning { color: #f59e0b; font-size: 11px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>IFC Batch Exporter</h1>
        <p>Laster ned alle synlige IFC-modeller til din "Nedlastinger"-mappe.</p>

        <button id="exportBtn" class="btn">Last ned alle IFC-filer</button>
        <p class="warning">Merk: Nettleseren din kan spørre om tillatelse til å laste ned flere filer samtidig. Svar "Tillat".</p>
        
        <div id="status" class="status-msg">Venter på tilkobling...</div>
        <div id="log">> Initialiserer...</div>
    </div>

    <script>
        let API = null;

        TrimbleConnectWorkspace.connect(window.parent, (event, args) => {
        }).then((api) => {
            API = api;
            document.getElementById('log').innerText = "> Koblet til Trimble Connect.";
            document.getElementById('status').innerText = "Klar";
        });

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerText += `\n> ${msg}`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Funksjon for å laste ned en fil via nettleseren
        function triggerDownload(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.style.display = 'none';
            document.body.appendChild(a);
            a.click();
            setTimeout(() => document.body.removeChild(a), 1000);
        }

        document.getElementById('exportBtn').addEventListener('click', async () => {
            if (!API) return;

            try {
                const models = await API.viewer.getModels();
                const ifcModels = models.filter(m => m.name.toLowerCase().endsWith('.ifc'));

                if (ifcModels.length === 0) {
                    log("Ingen IFC-filer funnet i visningen.");
                    return;
                }

                const btn = document.getElementById('exportBtn');
                btn.disabled = true;
                log(`Starter nedlasting av ${ifcModels.length} filer...`);

                for (const model of ifcModels) {
                    log(`Henter nedlastingslenke for ${model.name}...`);
                    
                    try {
                        const fileData = await API.project.getFile(model.id);
                        
                        // Bruker standard nettlesernedlasting i stedet for showDirectoryPicker
                        triggerDownload(fileData.downloadUrl, model.name);
                        
                        log(`Lagt i kø: ${model.name}`);
                        
                        // Vi legger inn en liten pause mellom hver fil for at nettleseren skal rekke å starte dem
                        await new Promise(resolve => setTimeout(resolve, 800));
                    } catch (e) {
                        log(`FEIL med ${model.name}: ${e.message}`);
                    }
                }

                document.getElementById('status').innerText = "Nedlasting ferdig!";
                log("Alle filer er sendt til nettleseren.");

            } catch (err) {
                log("Kritisk feil: " + err.message);
            } finally {
                document.getElementById('exportBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
