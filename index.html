<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>IFC Exporter v24</title>
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f4f6; padding: 10px; }
        .container { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 10px solid #8b5cf6; }
        .version-badge { background: #8b5cf6; color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; text-align: center; display: block; margin-bottom: 10px; }
        h1 { font-size: 16px; margin: 0 0 10px 0; }
        .btn { background-color: #0078d4; color: white; border: none; border-radius: 5px; padding: 10px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 8px; }
        #log { background: #111; color: #10b981; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 10px; height: 350px; overflow-y: auto; white-space: pre-wrap; margin-bottom: 10px; border: 1px solid #333; }
        .id-card { background: #f9fafb; border: 1px solid #ddd; padding: 8px; margin-bottom: 10px; border-radius: 4px; font-size: 11px; }
        .manual-btn { display: block; background: #8b5cf6; color: white; text-decoration: none; padding: 8px; border-radius: 4px; text-align: center; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="version-badge">VERSION 24.0 (ID-DISCOVERY)</div>
        <h1>IFC Exporter</h1>
        <button id="scanBtn" class="btn" style="background: #4b5563;">1. Finn modeller & skann IDer</button>
        <div id="log">> Venter på API...</div>
        <div id="fileList"></div>
    </div>

    <script>
        let API = null, accessToken = null, currentProjectId = null;

        async function init() {
            try {
                API = await TrimbleConnectWorkspace.connect(window.parent, (event, args) => {
                    if (event === "extension.accessToken" && args.data) {
                        accessToken = typeof args.data === "string" ? args.data : args.data.accessToken;
                    }
                });
                const project = await API.project.getCurrentProject();
                currentProjectId = project.id;
                await API.extension.requestPermission("accesstoken");
                log("Tilkoblet.");
            } catch (err) { log("Feil: " + err.message); }
        }

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerText += `\n> ${msg}`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (!API) return;
            try {
                const models = await API.viewer.getModels();
                const list = document.getElementById('fileList');
                list.innerHTML = "";
                
                const activeIFC = models.filter(m => m.name.toLowerCase().endsWith('.ifc') && (m.state === 'loaded' || m.loaded === true));
                log(`Fant ${activeIFC.length} aktive modeller.`);

                activeIFC.forEach(m => {
                    // ID-DETEKTIV: Vi leter etter alle mulige steder en GUID kan gjemme seg
                    // Vi prioriterer alt som IKKE starter med understrek (_)
                    const potentialIds = [
                        { name: "modelId", val: m.modelId },
                        { name: "versionId", val: m.versionId },
                        { name: "fileId", val: m.fileId },
                        { name: "id (original)", val: m.id }
                    ].filter(item => item.val && !String(item.val).startsWith('_'));

                    // Hvis vi bare har den med understrek, legg den til som nødvalg
                    if (potentialIds.length === 0) potentialIds.push({ name: "id (fallback)", val: m.id });

                    const card = document.createElement('div');
                    card.className = "id-card";
                    card.innerHTML = `<strong>${m.name}</strong><br>IDer funnet:`;
                    
                    potentialIds.forEach(p => {
                        const url = `https://app21.connect.trimble.com/tc/api/2.0/files/${p.val}/download?access_token=${accessToken}`;
                        const btn = document.createElement('a');
                        btn.className = "manual-btn";
                        btn.href = url;
                        btn.target = "_blank";
                        btn.innerText = `Last ned via ${p.name}`;
                        card.appendChild(btn);
                    });

                    list.appendChild(card);
                });
                
            } catch (err) { log("Skanning feilet."); }
        });

        init();
    </script>
</body>
</html>
