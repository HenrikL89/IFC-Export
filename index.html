<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>IFC Exporter v13</title>
    <!-- Vi bruker samme kilde som i Topics-dashboardet ditt -->
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f3f4f6; padding: 15px; color: #1f2937; }
        .container { max-width: 500px; margin: 0 auto; background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 8px solid #000; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { font-size: 18px; color: #111827; margin: 0; }
        .version { font-size: 10px; background: #000; color: #fff; padding: 2px 6px; border-radius: 4px; }
        .btn { background-color: #0078d4; color: white; border: none; border-radius: 5px; padding: 12px; cursor: pointer; width: 100%; font-weight: bold; margin-bottom: 10px; }
        .btn:disabled { background-color: #d1d5db; cursor: not-allowed; }
        #log { background: #111827; color: #10b981; padding: 10px; border-radius: 5px; font-family: monospace; font-size: 11px; height: 250px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>IFC Exporter</h1>
            <span class="version">v13.0</span>
        </div>
        
        <button id="scanBtn" class="btn" style="background: #4b5563;">1. Finn aktive modeller</button>
        <button id="exportBtn" class="btn" disabled>2. Start nedlasting</button>
        
        <div id="log">> Kobler til API...</div>
    </div>

    <script>
        let API = null;
        let activeIFCModels = [];

        // Initialiserer slik som i Topics-dashboardet
        TrimbleConnectWorkspace.connect(window.parent, (event, args) => {
            // Håndterer token-oppdateringer her hvis nødvendig
        }).then((api) => {
            API = api;
            log("Tilkoblet Trimble Connect.");
        }).catch(err => {
            log("FEIL ved tilkobling: " + err.message);
        });

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerText += `\n> ${msg}`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        document.getElementById('scanBtn').addEventListener('click', async () => {
            if (!API) return;
            try {
                const models = await API.viewer.getModels();
                // Vi finner modeller som er synlige/lastet i vieweren
                activeIFCModels = models.filter(m => 
                    m.name.toLowerCase().endsWith('.ifc') && 
                    (m.state === 'loaded' || m.loaded === true || m.visible === true)
                );
                
                log(`Fant ${activeIFCModels.length} aktive IFC-modeller.`);
                if (activeIFCModels.length > 0) {
                    activeIFCModels.forEach(m => log(`- ${m.name}`));
                    document.getElementById('exportBtn').disabled = false;
                }
            } catch (err) {
                log("FEIL ved skanning: " + err.message);
            }
        });

        document.getElementById('exportBtn').addEventListener('click', async () => {
            if (!API) return;
            const btn = document.getElementById('exportBtn');
            btn.disabled = true;

            log("Forsøker nedlasting via API Proxy...");

            for (const model of activeIFCModels) {
                try {
                    log(`Henter ${model.name}...`);

                    // VIKTIG: Vi bruker API-ets innebygde funksjoner for å unngå CORS.
                    // Vi prøver flere varianter siden biblioteket kan variere.
                    let fileResult = null;

                    if (API.project && typeof API.project.getFiles === 'function') {
                        const results = await API.project.getFiles([model.id]);
                        fileResult = results[0];
                    } else if (API.project && typeof API.project.getFile === 'function') {
                        fileResult = await API.project.getFile(model.id);
                    }

                    if (fileResult && fileResult.downloadUrl) {
                        // Vi har nå en URL som er godkjent for nedlasting
                        const a = document.createElement('a');
                        a.href = fileResult.downloadUrl;
                        a.download = model.name;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                        log(`SUKSESS: ${model.name}`);
                    } else {
                        log(`Kunne ikke hente lenke for ${model.name}.`);
                    }
                } catch (err) {
                    log(`FEIL med ${model.name}: ${err.message}`);
                }
                // Pause for å unngå at nettleseren blokkerer flere nedlastinger
                await new Promise(r => setTimeout(r, 1000));
            }

            log("Ferdig.");
            btn.disabled = false;
        });
    </script>
</body>
</html>
