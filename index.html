<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFC Batch Exporter</title>
    <!-- Den nyeste API-kilden -->
    <script src="https://components.connect.trimble.com/trimble-connect-workspace-api/index.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f9fafb; padding: 15px; color: #1f2937; }
        .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 5px solid #0078d4; }
        h1 { font-size: 20px; color: #0078d4; margin-top: 0; }
        .btn { 
            background-color: #0078d4; color: white; border: none; border-radius: 5px; 
            padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; 
            width: 100%; transition: 0.2s;
        }
        .btn:hover { background-color: #005a9e; }
        .btn:disabled { background-color: #d1d5db; cursor: not-allowed; }
        #log { 
            margin-top: 15px; background: #111827; color: #10b981; 
            padding: 10px; border-radius: 4px; font-family: monospace; 
            font-size: 11px; height: 160px; overflow-y: auto; 
        }
        .info-box { background: #fffbeb; border: 1px solid #f59e0b; padding: 10px; border-radius: 5px; font-size: 12px; margin-bottom: 15px; color: #92400e; }
    </style>
</head>
<body>

    <div class="container">
        <h1>IFC Batch Exporter</h1>
        
        <div class="info-box">
            <strong>Merk:</strong> Filene lagres i din standard nedlastingsmappe. <br>
            <em>Tips: Endre nedlastingsmappe i Chrome-innstillinger for å treffe din prosjektmappe automatisk.</em>
        </div>

        <button id="exportBtn" class="btn">Start nedlasting av IFC-filer</button>
        
        <div id="status" style="margin-top:10px; font-weight:bold; font-size:13px;">Venter på API...</div>
        <div id="log">> Initialiserer...</div>
    </div>

    <script>
        let API = null;

        // Koble til Trimble Connect API
        TrimbleConnectWorkspace.connect(window.parent, (event, args) => {
        }).then((api) => {
            API = api;
            document.getElementById('log').innerText = "> Koblet til Trimble Connect.";
            document.getElementById('status').innerText = "Klar";
        });

        function log(msg) {
            const logDiv = document.getElementById('log');
            logDiv.innerText += `\n> ${msg}`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Funksjon som trigger vanlig nedlasting uten showDirectoryPicker
        function downloadFile(url, filename) {
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.target = '_blank'; // Åpner i ny fane for å unngå iframe-sperre
            document.body.appendChild(a);
            a.click();
            setTimeout(() => document.body.removeChild(a), 1000);
        }

        document.getElementById('exportBtn').addEventListener('click', async () => {
            if (!API) {
                alert("API er ikke klart ennå.");
                return;
            }

            try {
                const models = await API.viewer.getModels();
                const ifcModels = models.filter(m => m.name.toLowerCase().endsWith('.ifc'));

                if (ifcModels.length === 0) {
                    log("Ingen IFC-filer funnet i visningen.");
                    return;
                }

                const btn = document.getElementById('exportBtn');
                btn.disabled = true;
                log(`Starter eksport av ${ifcModels.length} filer...`);

                for (let i = 0; i < ifcModels.length; i++) {
                    const model = ifcModels[i];
                    document.getElementById('status').innerText = `Henter (${i+1}/${ifcModels.length}): ${model.name}`;
                    
                    try {
                        // Henter selve nedlastingslenken fra Trimble
                        const fileData = await API.project.getFile(model.id);
                        
                        // Starter nedlasting
                        downloadFile(fileData.downloadUrl, model.name);
                        
                        log(`OK: ${model.name}`);
                        
                        // Vent litt mellom hver fil så nettleseren ikke blokkerer
                        await new Promise(r => setTimeout(r, 1000));
                    } catch (e) {
                        log(`FEIL: ${model.name} (${e.message})`);
                    }
                }

                document.getElementById('status').innerText = "Ferdig!";
                log("Alle filer er sendt til nedlasting.");

            } catch (err) {
                log("Feil: " + err.message);
                console.error(err);
            } finally {
                document.getElementById('exportBtn').disabled = false;
            }
        });
    </script>
</body>
</html>
